def requireIdeClientCheck = { result, gateName, expectedFragment ->
    def checks = result.checks ?: []
    if (!checks.any { it != null && it.toString().contains(expectedFragment) }) {
        throw new GradleException("${gateName} did not report required check containing '${expectedFragment}'")
    }
}

def requireIdeClientQuestionBankRoot = { result, gateName ->
    def expectedRoot = ideClientQuestionBankRoot
    def actualText = result.questionBankRoot?.toString()
    if (actualText == null || actualText.isBlank()) {
        throw new GradleException("${gateName} did not report questionBankRoot")
    }
    def actualRoot = new File(actualText).canonicalFile
    if (actualRoot != expectedRoot) {
        throw new GradleException("${gateName} used questionBankRoot ${actualRoot}, expected ${expectedRoot}")
    }
    if (!new File(actualRoot, 'manifest.json').isFile()) {
        throw new GradleException("${gateName} questionBankRoot does not contain manifest.json: ${actualRoot}")
    }
}

def requireDesktopIsolation = { result ->
    def isolation = result.desktopIsolation
    ['enabled', 'hidden', 'unfocused', 'cursorFree', 'windowed', 'silentDevice', 'clipboardIsolated'].each {
        if (isolation == null || isolation[it] != true)
            throw new GradleException("Client did not prove desktop isolation: ${it}")
    }
    if (isolation.verifiedTicks < 1 || isolation.violationCount != 0 || isolation.heapMaxMiB > 4096
            || isolation.processors > 2 || isolation.fpsLimit != 60)
        throw new GradleException('Invalid background client resource/isolation receipt')
}

def requireClientSession = { result, outputDir ->
    def launch = new groovy.json.JsonSlurper().parse(new File(outputDir, 'launch.json'))
    def exit = new groovy.json.JsonSlurper().parse(new File(outputDir, 'exit.json'))
    if (exit.sessionId != launch.sessionId || exit.runtimeExitCount != 1 || exit.exitCode != 0)
        throw new GradleException('Client did not exit cleanly after this session')
    if (!result.sessionId || result.sessionId != launch.sessionId || result.processStartCount != 1
            || result.worldLoadCount != 1 || result.cleanupFailureCount != 0 || result.allScenariosPassed != true
            || result.requestedScenarios != ['ide-review'] || result.observedScenarios != result.requestedScenarios)
        throw new GradleException('Client session/cleanup/scenario receipt does not match this launch')
    launch.sourceHashes.each { relative, expected ->
        def current = java.security.MessageDigest.getInstance('SHA-256').digest(file(relative).bytes).encodeHex().toString()
        if (current != expected) throw new GradleException("Client source changed during the session: ${relative}")
    }
}

def measureScreenshotPixels = { screenshot ->
    def colors = [] as Set
    int sampledPixels = 0
    int nonDarkPixels = 0
    int stepX = Math.max(1, (int) Math.floor(screenshot.width / 160.0d))
    int stepY = Math.max(1, (int) Math.floor(screenshot.height / 90.0d))
    for (int y = 0; y < screenshot.height; y += stepY) {
        for (int x = 0; x < screenshot.width; x += stepX) {
            int argb = screenshot.getRGB(x, y)
            int alpha = (argb >>> 24) & 0xff
            if (alpha == 0) {
                continue
            }
            sampledPixels++
            int rgb = argb & 0xffffff
            colors.add(rgb)
            int red = (rgb >>> 16) & 0xff
            int green = (rgb >>> 8) & 0xff
            int blue = rgb & 0xff
            if (red + green + blue > 90) {
                nonDarkPixels++
            }
        }
    }
    return [sampledPixels: sampledPixels, uniqueColors: colors.size(), nonDarkPixels: nonDarkPixels]
}

def requireIdeClientCaptureEvidence = { result, resultPath, gateName, outputDirProvider ->
    def outputDir = outputDirProvider.get().asFile.canonicalFile
    def captures = result.captures ?: []
    def seenCaptureNames = [] as Set
    captures.each { capture ->
        def captureName = capture.name?.toString()
        if (captureName == null || captureName.isBlank()) {
            throw new GradleException("${gateName} reported a screenshot capture without a name")
        }
        if (!seenCaptureNames.add(captureName)) {
            throw new GradleException("${gateName} reported duplicate screenshot capture ${captureName}")
        }
        def pathText = capture.path?.toString()
        if (pathText == null || pathText.isBlank()) {
            throw new GradleException("${gateName} capture ${captureName} did not report a screenshot path")
        }
        def captureFile = new File(pathText)
        if (!captureFile.isAbsolute()) {
            captureFile = new File(resultPath.parentFile, pathText)
        }
        captureFile = captureFile.canonicalFile
        if (!captureFile.toPath().startsWith(outputDir.toPath())) {
            throw new GradleException("${gateName} capture ${captureName} points outside ${outputDir}: ${captureFile}")
        }
        if (!captureFile.isFile()) {
            throw new GradleException("${gateName} capture ${captureName} screenshot file is missing: ${captureFile}")
        }
        def actualHash = java.security.MessageDigest.getInstance('SHA-256').digest(captureFile.bytes).encodeHex().toString()
        if (capture.sha256 != actualHash) throw new GradleException("${gateName} capture hash mismatch: ${captureName}")
        if (captureFile.length() <= 0L) {
            throw new GradleException("${gateName} capture ${captureName} screenshot file is empty: ${captureFile}")
        }
        def screenshot = javax.imageio.ImageIO.read(captureFile)
        if (screenshot == null) {
            throw new GradleException("${gateName} capture ${captureName} screenshot file is not a readable image: ${captureFile}")
        }
        ['framebufferWidth', 'framebufferHeight', 'guiWidth', 'guiHeight'].each { metric ->
            if (!(capture[metric] instanceof Number) || (capture[metric] as int) <= 0) {
                throw new GradleException("${gateName} capture ${captureName} has invalid ${metric}: ${capture[metric]}")
            }
        }
        if (screenshot.width != (capture.framebufferWidth as int)
                || screenshot.height != (capture.framebufferHeight as int)) {
            throw new GradleException("${gateName} capture ${captureName} screenshot dimensions ${screenshot.width}x${screenshot.height} do not match reported framebuffer ${capture.framebufferWidth}x${capture.framebufferHeight}")
        }
        def fileStats = measureScreenshotPixels(screenshot)
        if (fileStats.sampledPixels <= 100) {
            throw new GradleException("${gateName} capture ${captureName} screenshot file has too few sampled pixels: ${fileStats.sampledPixels}")
        }
        if (fileStats.uniqueColors < 8) {
            throw new GradleException("${gateName} capture ${captureName} screenshot file is visually blank or flat: ${fileStats.uniqueColors} unique colors")
        }
        if (fileStats.nonDarkPixels < 20) {
            throw new GradleException("${gateName} capture ${captureName} screenshot file has too few visible non-dark pixels: ${fileStats.nonDarkPixels}")
        }
        ['uniqueColors', 'nonDarkPixels'].each { metric ->
            if (!(capture[metric] instanceof Number) || (capture[metric] as int) <= 0) {
                throw new GradleException("${gateName} capture ${captureName} has invalid ${metric}: ${capture[metric]}")
            }
        }
        ['visualMetadataCount', 'loadedImageBlocks', 'missingImageBlocks', 'visibleImageBlocks'].each { metric ->
            if (!(capture[metric] instanceof Number) || (capture[metric] as int) < 0) {
                throw new GradleException("${gateName} capture ${captureName} has invalid ${metric}: ${capture[metric]}")
            }
        }
        if ((capture.visualMetadataCount as int) > 0) {
            if ((capture.loadedImageBlocks as int) <= 0) {
                throw new GradleException("${gateName} capture ${captureName} has visual metadata but no loaded image blocks")
            }
            if ((capture.missingImageBlocks as int) != 0) {
                throw new GradleException("${gateName} capture ${captureName} reported missing-image placeholders")
            }
            if ((capture.visibleImageBlocks as int) <= 0) {
                throw new GradleException("${gateName} capture ${captureName} has no visible loaded image block")
            }
        }
    }
}

tasks.register('verifyIdeClientSmokeResult') {
    group = 'verification'
    description = 'Fails the build unless the real Minecraft client IDE smoke test reports passed.'
    mustRunAfter tasks.named('runIdeClientSmokeTest')
    inputs.file ideSmokeResultFile
    doLast {
        def resultPath = ideSmokeResultFile.get().asFile
        if (!resultPath.isFile()) {
            throw new GradleException("IDE client smoke test did not write ${resultPath}")
        }
        def result = new groovy.json.JsonSlurper().parse(resultPath)
        requireDesktopIsolation(result)
        requireClientSession(result, ideSmokeOutputDir.get().asFile)
        if (result.status != 'passed') {
            throw new GradleException("IDE client smoke test failed in phase ${result.phase}: ${result.message}")
        }
        if ((result.checks?.size() ?: 0) < 300) {
            throw new GradleException("IDE client smoke test only reported ${result.checks?.size() ?: 0} checks")
        }
        requireIdeClientQuestionBankRoot(result, 'IDE client smoke test')
        ideClientRequiredCheckFragments.each { requireIdeClientCheck(result, 'IDE client smoke test', it) }
        def captureNames = (result.captures ?: []).collect { it.name }
        ['ide-wide', 'sample-p7', 'ide-narrow'].each { expectedCapture ->
            if (!captureNames.contains(expectedCapture)) {
                throw new GradleException("IDE client smoke test did not capture ${expectedCapture}; got ${captureNames}")
            }
        }
        requireIdeClientCaptureEvidence(result, resultPath, 'IDE client smoke test', ideSmokeOutputDir)
        if (!result.smokeProblemIds?.contains('7')) {
            throw new GradleException("IDE client smoke test did not cover problem p7; got ${result.smokeProblemIds}")
        }
    }
}

tasks.register('cleanIdeClientSmokeOutput', Delete) {
    dependsOn 'algocraftTestRuntimeLease'
    doFirst {
        def prior = ideSmokeOutputDir.get().asFile
        if (new File(prior, 'result.json').isFile()) {
            copy { from prior; into layout.buildDirectory.dir("review/client-history/smoke-${UUID.randomUUID()}") }
        }
    }
    delete ideSmokeOutputDir
}

tasks.register('verifyIdeClientStressResult') {
    group = 'verification'
    description = 'Fails the build unless the repeated real Minecraft client IDE stress test reports passed.'
    mustRunAfter tasks.named('runIdeClientStressTest')
    inputs.file ideStressResultFile
    doLast {
        def resultPath = ideStressResultFile.get().asFile
        if (!resultPath.isFile()) {
            throw new GradleException("IDE client stress test did not write ${resultPath}")
        }
        def result = new groovy.json.JsonSlurper().parse(resultPath)
        requireDesktopIsolation(result)
        requireClientSession(result, ideStressOutputDir.get().asFile)
        if (result.status != 'passed') {
            throw new GradleException("IDE client stress test failed in phase ${result.phase}: ${result.message}")
        }
        if ((result.stressPasses as int) < 10) {
            throw new GradleException("IDE client stress test only ran ${result.stressPasses} passes")
        }
        if ((result.checks?.size() ?: 0) < 1000) {
            throw new GradleException("IDE client stress test only reported ${result.checks?.size() ?: 0} checks")
        }
        requireIdeClientQuestionBankRoot(result, 'IDE client stress test')
        ideClientRequiredCheckFragments.each { requireIdeClientCheck(result, 'IDE client stress test', it) }
        def expectedProblemIds = ['7', '1', '73', '95', '500']
        if (!result.smokeProblemIds?.containsAll(expectedProblemIds)) {
            throw new GradleException("IDE client stress test did not cover representative problems ${expectedProblemIds}; got ${result.smokeProblemIds}")
        }
        ideClientStressRequiredCheckFragments.each { requireIdeClientCheck(result, 'IDE client stress test', it) }
        def captureNames = result.captures.collect { it.name }
        if ((result.captures?.size() ?: 0) < 7) {
            throw new GradleException("IDE client stress test only captured ${result.captures?.size() ?: 0} screenshots")
        }
        ['ide-wide', 'ide-narrow'].each { expectedCapture ->
            if (!captureNames.contains(expectedCapture)) {
                throw new GradleException("IDE client stress test did not capture ${expectedCapture}; got ${captureNames}")
            }
        }
        expectedProblemIds.each { id ->
            if (!captureNames.contains('sample-p' + id)) {
                throw new GradleException("IDE client stress test did not capture representative problem p${id}")
            }
        }
        requireIdeClientCaptureEvidence(result, resultPath, 'IDE client stress test', ideStressOutputDir)
    }
}

tasks.register('cleanIdeClientStressOutput', Delete) {
    dependsOn 'algocraftTestRuntimeLease'
    doFirst {
        def prior = ideStressOutputDir.get().asFile
        if (new File(prior, 'result.json').isFile()) {
            copy { from prior; into layout.buildDirectory.dir("review/client-history/stress-${UUID.randomUUID()}") }
        }
    }
    delete ideStressOutputDir
}

tasks.named('runIdeClientSmokeTest') {
    dependsOn tasks.named('cleanIdeClientSmokeOutput')
    // Retain the raw exit result so verification can seal it alongside the
    // harness receipt. Verification still requires a clean exit code of zero.
    ignoreExitValue = true
    finalizedBy tasks.named('verifyIdeClientSmokeResult')
}

tasks.named('runIdeClientStressTest') {
    dependsOn tasks.named('cleanIdeClientStressOutput')
    mustRunAfter tasks.named('runIdeClientSmokeTest')
    // Verification requires a passed stress result, matching launch/source
    // evidence, screenshots and a clean process exit.
    ignoreExitValue = true
    finalizedBy tasks.named('verifyIdeClientStressResult')
}

tasks.register('ideAcceptanceTest') {
    group = 'verification'
    description = 'Runs JUnit coverage plus the real Minecraft client IDE smoke test.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('runIdeClientSmokeTest')
    dependsOn tasks.named('verifyIdeClientSmokeResult')
}

tasks.register('ideStressTest') {
    group = 'verification'
    description = 'Runs the repeated real Minecraft client IDE interaction stress test.'
    mustRunAfter tasks.named('ideAcceptanceTest')
    dependsOn tasks.named('runIdeClientStressTest')
    dependsOn tasks.named('verifyIdeClientStressResult')
}

tasks.register('ideClientAcceptanceTest') {
    group = 'verification'
    description = 'Runs all compatible IDE acceptance cases in one loaded world with ten interaction passes.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('ideStressTest')
}

tasks.register('algocraftCoreAcceptanceTest') {
    group = 'verification'
    description = 'Runs build, official bank, GameTest server, and real Minecraft IDE client acceptance gates.'
    dependsOn tasks.named('build')
    dependsOn tasks.named('ideClientAcceptanceTest')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        // Force add jarJar configuration to the compile scope for IntelliJ
        scopes.COMPILE.plus += [ configurations.jarJar ]
        scopes.RUNTIME.plus += [ configurations.jarJar ]
    }
}

apply from: 'gradle/algocraft-tests.gradle'

// Each declared member of the multiplayer topology has its own resource lease.
tasks.named('runBankServer') {
    dependsOn 'algocraftTestRuntimeLease'
    notCompatibleWithConfigurationCache('Dedicated multiplayer fixture lifecycle')
}

tasks.register('serverBankUnitTest', Test) {
    group = 'verification'
    description = 'Exercises bank publication, cache/session isolation and versioned server submissions.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/PublishedCatalogTest.class', '**/PublicJudgeFeedbackTest.class', '**/ClientCatalogTest.class', '**/ProgressManagerTest.class', '**/NetworkPayloadContractTest.class', '**/ClientTranslationCoverageTest.class', '**/ProblemManagerWebApiIntegrationTest.class', '**/AlgoCraftWebServerTest.class'
    configureAlgoCraftJUnitTask(delegate)
}

