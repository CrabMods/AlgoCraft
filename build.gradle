plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.121'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

if (providers.gradleProperty('algocraftBuildDirectory').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('algocraftBuildDirectory').get())
}

tasks.named('jar', Jar) {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'META-INF/licenses' }
}

// Forge eventbus declares 0.6.+; retain the verified 0.6.3 selection without
// querying changing metadata from unrelated Minecraft Maven proxies.
configurations.configureEach {
    resolutionStrategy.force 'net.jodah:typetools:0.6.3'
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'TypeToolsCentral'
                url = 'https://repo.maven.apache.org/maven2'
            }
        }
        filter { includeModule('net.jodah', 'typetools') }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com"
    }
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 ships Java 17; player code and mod bytecode target it too.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Use the Forge build for the branch's Minecraft version.
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'algocraft.tests.realtimeGameTicks', 'true'
            jvmArguments.addAll '-Xms256m', '-Xmx2G', '-XX:ActiveProcessorCount=2'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        ideClientSmokeTest {
            client()
            systemProperty 'algocraft.tests.unattended', 'true'
            jvmArguments.addAll '-Xms256m', '-Xmx4G', '-XX:ActiveProcessorCount=2'
            gameDirectory = project.file('run-ide-smoke')
            programArguments.addAll '--width', '960', '--height', '540'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'algocraft.ideSmokeTest', 'true'
            systemProperty 'algocraft.ideSmokeQuestionBank', file('question_bank/official').getAbsolutePath()
            systemProperty 'algocraft.webPort', '3305'
            systemProperty 'algocraft.ideSmokeOutputDir', layout.buildDirectory.dir('algocraft-ide-smoke').get().asFile.getAbsolutePath()
            systemProperty 'algocraft.ideSmokeProblemId', '7'
            systemProperty 'algocraft.ideSmokeMaxTicks', '1800'
            systemProperty 'algocraft.codeExecutor.forceEcjCompiler', 'true'
        }

        ideClientStressTest {
            client()
            systemProperty 'algocraft.tests.unattended', 'true'
            jvmArguments.addAll '-Xms256m', '-Xmx4G', '-XX:ActiveProcessorCount=2'
            gameDirectory = project.file('run-ide-stress')
            programArguments.addAll '--width', '960', '--height', '540'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'algocraft.ideSmokeTest', 'true'
            systemProperty 'algocraft.ideSmokeQuestionBank', file('question_bank/official').getAbsolutePath()
            systemProperty 'algocraft.webPort', '3306'
            systemProperty 'algocraft.ideSmokeOutputDir', layout.buildDirectory.dir('algocraft-ide-stress').get().asFile.getAbsolutePath()
            systemProperty 'algocraft.ideSmokeProblemId', '7'
            systemProperty 'algocraft.ideSmokeProblemIds', '7,1,73,95,500'
            systemProperty 'algocraft.ideSmokeStressPasses', '10'
            systemProperty 'algocraft.ideSmokeMaxTicks', '4800'
            systemProperty 'algocraft.codeExecutor.forceEcjCompiler', 'true'
        }

        bankServer {
            server()
            gameDirectory = project.file('run-bank-server')
            programArgument '--nogui'
            jvmArguments.addAll '-Xms256m', '-Xmx2G', '-XX:ActiveProcessorCount=2'
            systemProperty 'algocraft.bankServerTest', 'true'
            systemProperty 'algocraft.bankOutput', layout.buildDirectory.dir('algocraft-bank-multiplayer').get().asFile.absolutePath
        }
        bankClientA {
            client()
            gameDirectory = project.file('run-bank-client-a')
            programArguments.addAll '--width', '960', '--height', '540', '--username', 'BankA'
            jvmArguments.addAll '-Xms256m', '-Xmx4G', '-XX:ActiveProcessorCount=2'
            systemProperty 'algocraft.tests.unattended', 'true'
            systemProperty 'algocraft.bankClientTest', 'true'
            systemProperty 'algocraft.bankRole', 'A'
            systemProperty 'algocraft.bankOutput', layout.buildDirectory.dir('algocraft-bank-multiplayer').get().asFile.absolutePath
            systemProperty 'algocraft.bankPort', '25586'
            systemProperty 'algocraft.webPort', '3011'
        }
        bankClientB {
            client()
            gameDirectory = project.file('run-bank-client-b')
            programArguments.addAll '--width', '960', '--height', '540', '--username', 'BankB'
            jvmArguments.addAll '-Xms256m', '-Xmx4G', '-XX:ActiveProcessorCount=2'
            systemProperty 'algocraft.tests.unattended', 'true'
            systemProperty 'algocraft.bankClientTest', 'true'
            systemProperty 'algocraft.bankRole', 'B'
            systemProperty 'algocraft.bankOutput', layout.buildDirectory.dir('algocraft-bank-multiplayer').get().asFile.absolutePath
            systemProperty 'algocraft.bankPort', '25586'
            systemProperty 'algocraft.webPort', '3012'
        }
        data {
            data()

            // crabmods of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def gameTestStructureSync = tasks.register('syncGameTestStructures', Sync) {
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    into layout.projectDirectory.dir('run/gameteststructures')
}

tasks.named('prepareGameTestServerRun').configure {
    dependsOn gameTestStructureSync
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // JUnit 5 for solution testing
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Judge workers extract the compiler resource below. The Minecraft module
    // scanner must not load ECJ's service descriptor as a jar-in-jar library.
    localRuntime 'org.eclipse.jdt:ecj:3.46.0'
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

def ecjCompilerResourceDir = layout.buildDirectory.dir('generated/resources/ecj')
def bundledBankResourceDir = layout.buildDirectory.dir('generated/resources/question-bank')
tasks.register('bundleOfficialQuestionBank', Zip) {
    inputs.property 'jsonLineEndings', 'UTF8-LF-v2'
    filteringCharset = 'UTF-8'
    from('question_bank/official') {
        include 'manifest.json', 'catalog.json', 'p*.json', 'lang/**/*.json', 'images/*.png'
        filesMatching('**/*.json') {
            filter(org.apache.tools.ant.filters.FixCrLfFilter,
                    eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'), fixlast: false)
        }
    }
    archiveFileName = 'official-bank.zip'
    destinationDirectory = bundledBankResourceDir.map { it.dir('assets/algocraft') }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
sourceSets.main.resources.srcDir bundledBankResourceDir
tasks.register('copyEcjCompilerJar', Sync) {
    into ecjCompilerResourceDir
    from(configurations.runtimeClasspath) {
        include 'ecj-*.jar'
        rename { 'ecj.jar' }
        into 'assets/algocraft/compiler'
    }
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir ecjCompilerResourceDir
tasks.named('processResources') {
    dependsOn tasks.named('copyEcjCompilerJar')
    dependsOn tasks.named('bundleOfficialQuestionBank')
}
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

def configureAlgoCraftJUnitTask = { Test testTask ->
    testTask.useJUnitPlatform()
    testTask.testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'short'
    }
    // Increase heap for compiling 500+ solutions.
    testTask.jvmArgs '-Xmx2g', '-XX:ActiveProcessorCount=2'
    // Bound each individual test invocation. Large official-bank coverage is split
    // into shards below so a stuck solution points at a concrete problem range.
    testTask.systemProperty 'junit.jupiter.execution.timeout.default', '300s'
    testTask.systemProperty 'junit.jupiter.execution.timeout.mode', 'enabled'
    testTask.systemProperty 'algocraft.codeExecutorTimeoutMs',
            System.getProperty('algocraft.codeExecutorTimeoutMs', '8000')
    testTask.maxParallelForks = 1
}

// JUnit 5 test configuration
tasks.named('test', Test) {
    configureAlgoCraftJUnitTask(delegate)
    exclude '**/SolutionTestSuite.class'
    exclude '**/JudgeOfficialAllReferenceTest.class'
    exclude '**/OfficialRepositoryTest.class'
}

// Test-only directories. Restore bytes even if the client or preflight fails.
['IdeClientSmokeTest': 'run-ide-smoke', 'IdeClientStressTest': 'run-ide-stress', 'BankClientA': 'run-bank-client-a', 'BankClientB': 'run-bank-client-b'].each { suffix, directory ->
    def saved = [:]
    def runtime = file(directory)
    def sessionId = System.getenv('ALGOCRAFT_TEST_SESSION_ID') ?: UUID.randomUUID().toString()
    def output = layout.buildDirectory.dir(suffix.startsWith('BankClient') ? 'algocraft-bank-multiplayer/' + suffix : suffix == 'IdeClientSmokeTest' ? 'algocraft-ide-smoke' : 'algocraft-ide-stress').get().asFile
    def projectSourceFiles = fileTree('src/main') { include '**/*.java', '**/*.json', '**/*.toml' }.files
    def projectRootPath = project.projectDir.toPath()
    def restore = tasks.register("restore${suffix}Configuration") {
        doLast {
            saved.each { path, bytes ->
                if (bytes == null) java.nio.file.Files.deleteIfExists(path.toPath())
                else java.nio.file.Files.write(path.toPath(), bytes)
            }
        }
    }
    tasks.named("run${suffix}") {
        notCompatibleWithConfigurationCache('Runtime configuration snapshots must be shared with the restoration finalizer')
        // Custom NeoForge task names need an explicit connection in v0.1.14.
        dependsOn 'algocraftTestRuntimeLease'
        mustRunAfter 'runGameTestServer'
        finalizedBy restore
        doFirst {
            environment 'ALGOCRAFT_TEST_SESSION_ID', sessionId
            def sourceHashes = projectSourceFiles.sort().collectEntries { path ->
                [(projectRootPath.relativize(path.toPath()).toString()):
                 java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString()]
            }
            output.mkdirs()
            new File(output, 'launch.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    sessionId: sessionId, task: "run${suffix}", runtimeDirectory: runtime.absolutePath,
                    launchedAtUtc: java.time.Instant.now().toString(), sourceHashes: sourceHashes,
                    unattended: true, heapMaxMiB: 4096, processors: 2, fpsLimit: 60])), 'UTF-8')
            ['Window', 'Input', 'Audio', 'Clipboard'].each { kind ->
                if (!file("src/main/java/com/crabmods/algocraft/mixin/Unattended${kind}Mixin.java").isFile())
                    throw new GradleException("Missing unattended ${kind} adapter; client launch refused")
            }
            def config = new File(runtime, 'config/fml.toml')
            def options = new File(runtime, 'options.txt')
            [config, options].each { path ->
                saved[path] = path.isFile() ? path.bytes : null
                path.parentFile.mkdirs()
            }
            def configText = config.isFile() ? config.getText('UTF-8') : ''
            configText = configText.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, '')
            config.setText(configText + '\nearlyWindowControl = false\n', 'UTF-8')
            def optionsText = options.isFile() ? options.getText('UTF-8') : ''
            ['fullscreen': 'false', 'pauseOnLostFocus': 'false', 'maxFps': '60'].each { key, value ->
                optionsText = optionsText.replaceAll("(?m)^${key}:.*", '') + "\n${key}:${value}\n"
            }
            options.setText(optionsText, 'UTF-8')
            if (!(config.text =~ /(?m)^earlyWindowControl\s*=\s*false\s*$/).find())
                throw new GradleException('Early loader window must be disabled before client launch')
            // Ensure the shipped bank is tested on an actual first installation.
            delete new File(runtime, 'algorithm_challenges/repos/official')
        }
        doLast {
            new File(output, 'exit.json').setText(groovy.json.JsonOutput.toJson([
                    sessionId: sessionId, runtimeExitCount: 1, exitCode: executionResult.get().exitValue,
                    exitedAtUtc: java.time.Instant.now().toString()]), 'UTF-8')
        }
    }
}

tasks.register('reviewFixTest', Test) {
    group = 'verification'
    description = 'Runs review fixes in a separate result directory from the full JUnit suite.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    ['BundledOfficialBankTest', 'CodeDraftStoreTest', 'AlgoCraftWebServerTest', 'IdeLayoutEngineTest', 'NetworkPayloadContractTest', 'ProblemManagerWebApiIntegrationTest'].each {
        include "**/${it}.class"
    }
    configureAlgoCraftJUnitTask(delegate)
}

tasks.register('runWebIdeReview', JavaExec) {
    group = 'verification'
    description = 'Starts the production web IDE with an isolated full-bank browser QA fixture.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.crabmods.algocraft.logic.WebIdeReviewServer'
    systemProperty 'algocraft.codeExecutor.forceEcjCompiler', 'true'
}

def officialQuestionBankShardTasks = []
def officialQuestionBankShardSize = 50
def officialQuestionBankQualityTask = tasks.register('officialQuestionBankQualityTest', Test) {
    group = 'verification'
    description = 'Runs official question-bank structure, translation, diagram, and render-quality coverage.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/QuestionBankQualityTest.class'
    include '**/OfficialProblemStatementRenderTest.class'
    include '**/OfficialProblemChineseTranslationTest.class'
    include '**/OfficialDiagramLayoutTest.class'
    configureAlgoCraftJUnitTask(delegate)
    mustRunAfter tasks.named('test')
}
// Retain the transport/cache contracts excluded with the legacy monolith.
def officialRepositoryContractSource = file('src/test/java/com/crabmods/algocraft/logic/repo/OfficialRepositoryTest.java').getText('UTF-8')
def officialRepositoryContractPrefix = officialRepositoryContractSource.substring(0,
        officialRepositoryContractSource.indexOf('    void forceRefreshRejectsReviewedReferenceSolutionDescriptionsWithoutKeyInsight'))
def officialRepositoryContractSuffix = officialRepositoryContractSource.substring(
        officialRepositoryContractSource.indexOf('    void forceRefreshRejectsTooFewReferenceSolutions'),
        officialRepositoryContractSource.indexOf('    private static List<Path> temporaryRepositoryDirs'))
def officialRepositoryContractNames = ((officialRepositoryContractPrefix + officialRepositoryContractSuffix)
        =~ /(?m)^    void ([A-Za-z0-9_]+)\(/).collect { it[1] }
tasks.register('officialRepositoryContractTest', Test) {
    group = 'verification'
    description = 'Restores cache, download rollback, translation and asset contracts excluded with the legacy monolithic suite.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/OfficialRepositoryTest.class'
    filter {
        officialRepositoryContractNames.each { includeTestsMatching("com.crabmods.algocraft.logic.repo.OfficialRepositoryTest.${it}") }
    }
    configureAlgoCraftJUnitTask(delegate)
    mustRunAfter tasks.named('test')
}
def previousOfficialQuestionBankTask = officialQuestionBankQualityTask
for (int shardStart = 1; shardStart <= 500; shardStart += officialQuestionBankShardSize) {
    int rangeStart = shardStart
    int rangeEnd = Math.min(500, rangeStart + officialQuestionBankShardSize - 1)
    String rangeName = String.format('P%03dToP%03d', rangeStart, rangeEnd)
    String taskName = "officialQuestionBankTest${rangeName}"
    def predecessorTask = previousOfficialQuestionBankTask

    def shardTask = tasks.register(taskName, Test) {
        group = 'verification'
        description = "Runs official solution-engine and Judge-semantics coverage for problems p${rangeStart}-p${rangeEnd}."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/SolutionTestSuite.class'
        include '**/JudgeOfficialAllReferenceTest.class'
        systemProperty 'algocraft.officialProblemStart', rangeStart.toString()
        systemProperty 'algocraft.officialProblemEnd', rangeEnd.toString()
        systemProperty 'algocraft.officialJudgeAllTests', 'true'
        systemProperty 'algocraft.officialJudgeIsolatedProcess', 'true'
        systemProperty 'algocraft.codeExecutor.forceEcjCompiler', 'true'
        configureAlgoCraftJUnitTask(delegate)
        mustRunAfter predecessorTask
    }
    officialQuestionBankShardTasks.add(shardTask)
    previousOfficialQuestionBankTask = shardTask
}

tasks.register('officialQuestionBankTest') {
    group = 'verification'
    description = 'Runs the full official question bank quality, solution, and Judge-semantics suites in observable p50 shards.'
    dependsOn officialQuestionBankQualityTask
    dependsOn officialQuestionBankShardTasks
}

tasks.named('check') {
    dependsOn tasks.named('officialRepositoryContractTest')
    dependsOn tasks.named('officialQuestionBankTest')
    dependsOn tasks.named('runGameTestServer')
}

tasks.named('runGameTestServer') {
    mustRunAfter tasks.named('officialQuestionBankTest')
}

